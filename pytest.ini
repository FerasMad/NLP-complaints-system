[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    gpu: requires CUDA-enabled GPU
    slow: takes more than 30 seconds
    integration: end-to-end test (loads model, hits API, etc.)
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
