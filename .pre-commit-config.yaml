# Pre-commit hooks. Install with:
#   pip install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^(app|src)/
        additional_dependencies: ["pydantic>=2", "types-requests"]
        args: ["--config-file=pyproject.toml"]

  # Run pytest collection (NOT full suite — too slow for pre-commit)
  - repo: local
    hooks:
      - id: pytest-collect
        name: pytest --collect-only (smoke check)
        entry: pytest --collect-only --quiet
        language: system
        pass_filenames: false
        types: [python]
