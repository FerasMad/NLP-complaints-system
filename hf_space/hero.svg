<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Warm Saudi dusk over a row of date palms and rooftops">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0AD7A"/>
      <stop offset="35%" stop-color="#D4753D"/>
      <stop offset="70%" stop-color="#9C4324"/>
      <stop offset="100%" stop-color="#3A1810"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="82%" cy="38%" r="0.40">
      <stop offset="0%" stop-color="#FFE3A8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFE3A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="50%" cy="100%" r="0.65">
      <stop offset="0%" stop-color="#FFD27A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFD27A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mashrabiya" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <path d="M 24 0 L 48 24 L 24 48 L 0 24 Z M 24 14 L 34 24 L 24 34 L 14 24 Z" fill="#FFD27A" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="560" fill="url(#sky)"/>

  <!-- Mashrabiya pattern overlay (very subtle) -->
  <rect width="1200" height="560" fill="url(#mashrabiya)"/>

  <!-- Sun disc -->
  <circle cx="984" cy="212" r="62" fill="#FFE3A8" opacity="0.92"/>
  <circle cx="984" cy="212" r="78" fill="#FFE3A8" opacity="0.20"/>

  <!-- Sun glow -->
  <rect width="1200" height="560" fill="url(#sunglow)"/>

  <!-- Distant city silhouette -->
  <g fill="#2A130A" opacity="0.85">
    <path d="M 0 440
             L 0 400 L 60 400 L 70 380 L 100 380 L 110 400
             L 160 400 L 170 360 L 220 360 L 220 340 L 240 340 L 240 360 L 280 360
             L 290 400 L 340 400 L 340 370 L 360 370 L 360 360 L 380 360 L 380 400
             L 420 400 L 430 380 L 470 380 L 480 400
             L 540 400 L 540 350 L 560 350 L 560 340 L 580 340 L 580 350 L 600 350 L 610 400
             L 660 400 L 660 380 L 690 380 L 690 360 L 710 360 L 710 380 L 740 380 L 740 400
             L 800 400 L 810 360 L 830 360 L 830 350 L 850 350 L 850 360 L 870 360 L 880 400
             L 940 400 L 940 380 L 970 380 L 970 400
             L 1020 400 L 1030 380 L 1070 380 L 1080 400
             L 1140 400 L 1150 370 L 1180 370 L 1190 400 L 1200 400
             L 1200 560 L 0 560 Z"/>
  </g>

  <!-- Mid-ground dune ridge -->
  <path d="M 0 480 Q 200 460 400 480 T 800 478 T 1200 480 L 1200 560 L 0 560 Z" fill="#1A0A05" opacity="0.9"/>

  <!-- Palm trees (grouped, asymmetric placement) -->
  <g fill="#160805">
    <!-- Palm 1 (left, larger, foreground) -->
    <g transform="translate(140 480)">
      <path d="M -4 0 C -2 -100 0 -180 2 -240 C 4 -180 6 -100 4 0 Z"/>
      <g transform="translate(0 -240)">
        <ellipse cx="-32" cy="-2" rx="46" ry="9" transform="rotate(-22)"/>
        <ellipse cx="32" cy="-2" rx="46" ry="9" transform="rotate(22)"/>
        <ellipse cx="-44" cy="6" rx="50" ry="9" transform="rotate(-50)"/>
        <ellipse cx="44" cy="6" rx="50" ry="9" transform="rotate(50)"/>
        <ellipse cx="-22" cy="-14" rx="44" ry="8" transform="rotate(-78)"/>
        <ellipse cx="22" cy="-14" rx="44" ry="8" transform="rotate(78)"/>
      </g>
    </g>

    <!-- Palm 2 (mid-left) -->
    <g transform="translate(310 485)">
      <path d="M -3 0 C -2 -90 0 -160 1 -200 C 2 -160 4 -90 3 0 Z"/>
      <g transform="translate(0 -200)">
        <ellipse cx="-28" cy="-2" rx="40" ry="7" transform="rotate(-22)"/>
        <ellipse cx="28" cy="-2" rx="40" ry="7" transform="rotate(22)"/>
        <ellipse cx="-38" cy="4" rx="44" ry="7" transform="rotate(-52)"/>
        <ellipse cx="38" cy="4" rx="44" ry="7" transform="rotate(52)"/>
        <ellipse cx="-18" cy="-12" rx="38" ry="6" transform="rotate(-80)"/>
        <ellipse cx="18" cy="-12" rx="38" ry="6" transform="rotate(80)"/>
      </g>
    </g>

    <!-- Palm 3 (right, slimmer) -->
    <g transform="translate(880 482)">
      <path d="M -3 0 C -2 -94 0 -170 1 -218 C 2 -170 4 -94 3 0 Z"/>
      <g transform="translate(0 -218)">
        <ellipse cx="-30" cy="-2" rx="42" ry="8" transform="rotate(-20)"/>
        <ellipse cx="30" cy="-2" rx="42" ry="8" transform="rotate(20)"/>
        <ellipse cx="-40" cy="4" rx="46" ry="8" transform="rotate(-50)"/>
        <ellipse cx="40" cy="4" rx="46" ry="8" transform="rotate(50)"/>
        <ellipse cx="-20" cy="-12" rx="40" ry="7" transform="rotate(-80)"/>
        <ellipse cx="20" cy="-12" rx="40" ry="7" transform="rotate(80)"/>
      </g>
    </g>

    <!-- Palm 4 (far right, smaller) -->
    <g transform="translate(1060 488)">
      <path d="M -2.5 0 C -2 -82 0 -150 1 -184 C 2 -150 4 -82 2.5 0 Z"/>
      <g transform="translate(0 -184)">
        <ellipse cx="-26" cy="-2" rx="36" ry="6" transform="rotate(-22)"/>
        <ellipse cx="26" cy="-2" rx="36" ry="6" transform="rotate(22)"/>
        <ellipse cx="-34" cy="4" rx="40" ry="6" transform="rotate(-52)"/>
        <ellipse cx="34" cy="4" rx="40" ry="6" transform="rotate(52)"/>
        <ellipse cx="-16" cy="-10" rx="34" ry="5" transform="rotate(-80)"/>
        <ellipse cx="16" cy="-10" rx="34" ry="5" transform="rotate(80)"/>
      </g>
    </g>
  </g>

  <!-- Lantern lights (warm dots scattered along skyline) -->
  <g fill="#FFD27A">
    <circle cx="80" cy="395" r="1.8" opacity="0.85"/>
    <circle cx="195" cy="395" r="2" opacity="0.9"/>
    <circle cx="240" cy="350" r="2.2" opacity="0.85"/>
    <circle cx="385" cy="395" r="1.8" opacity="0.8"/>
    <circle cx="455" cy="395" r="2" opacity="0.9"/>
    <circle cx="595" cy="395" r="2.2" opacity="0.85"/>
    <circle cx="700" cy="378" r="1.8" opacity="0.8"/>
    <circle cx="780" cy="395" r="2" opacity="0.9"/>
    <circle cx="855" cy="380" r="2.2" opacity="0.85"/>
    <circle cx="1010" cy="395" r="1.8" opacity="0.8"/>
    <circle cx="1095" cy="395" r="2" opacity="0.9"/>
    <circle cx="1170" cy="385" r="2.2" opacity="0.85"/>
  </g>

  <!-- Final warm haze at the bottom -->
  <rect width="1200" height="560" fill="url(#haze)"/>
</svg>
