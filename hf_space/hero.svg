<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A single date palm silhouette against a warm dusk sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E89B6A"/>
      <stop offset="55%" stop-color="#B85230"/>
      <stop offset="100%" stop-color="#3A1810"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="22%" cy="62%" r="0.55">
      <stop offset="0%" stop-color="#FFD89A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD89A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="560" fill="url(#sky)"/>
  <rect width="1200" height="560" fill="url(#sunglow)"/>

  <!-- A single date palm. Asymmetric placement: hugs the left third. -->
  <g fill="#1A0A05" transform="translate(280 560)">
    <!-- Trunk: tapered, slightly curved -->
    <path d="M -7 0
             C -4 -120 -2 -260 -1 -360
             C 0 -380 2 -395 4 -395
             C 6 -395 8 -380 9 -360
             C 10 -260 12 -120 15 0 Z"/>
    <!-- Trunk texture: faint horizontal banding -->
    <g opacity="0.45" fill="#0F0503">
      <rect x="-6" y="-40" width="20" height="3" rx="1"/>
      <rect x="-6" y="-90" width="20" height="3" rx="1"/>
      <rect x="-5" y="-150" width="19" height="3" rx="1"/>
      <rect x="-4" y="-210" width="18" height="3" rx="1"/>
      <rect x="-3" y="-270" width="17" height="3" rx="1"/>
      <rect x="-2" y="-320" width="15" height="3" rx="1"/>
    </g>
    <!-- Crown: 9 fronds radiating, asymmetric weighting -->
    <g transform="translate(4 -395)">
      <!-- Lower-left frond, longest -->
      <path d="M 0 0 Q -55 14 -120 26 Q -90 12 -65 4 Q -35 0 0 0 Z"/>
      <!-- Lower-right frond -->
      <path d="M 0 0 Q 55 14 120 26 Q 90 12 65 4 Q 35 0 0 0 Z"/>
      <!-- Mid-left, dipped -->
      <path d="M 0 0 Q -55 -2 -110 8 Q -88 -4 -62 -8 Q -32 -6 0 0 Z"/>
      <!-- Mid-right -->
      <path d="M 0 0 Q 55 -2 110 8 Q 88 -4 62 -8 Q 32 -6 0 0 Z"/>
      <!-- Upper-left, lifted -->
      <path d="M 0 0 Q -45 -22 -95 -38 Q -75 -28 -55 -18 Q -28 -8 0 0 Z"/>
      <!-- Upper-right -->
      <path d="M 0 0 Q 45 -22 95 -38 Q 75 -28 55 -18 Q 28 -8 0 0 Z"/>
      <!-- Top-left, tallest -->
      <path d="M 0 0 Q -22 -38 -50 -75 Q -36 -56 -22 -36 Q -10 -16 0 0 Z"/>
      <!-- Top-right -->
      <path d="M 0 0 Q 22 -38 50 -75 Q 36 -56 22 -36 Q 10 -16 0 0 Z"/>
      <!-- Crown center, vertical -->
      <path d="M 0 0 Q -3 -32 -2 -65 Q 0 -75 2 -65 Q 3 -32 0 0 Z"/>
      <!-- Date cluster, small -->
      <ellipse cx="0" cy="6" rx="9" ry="5" opacity="0.85"/>
    </g>
  </g>

  <!-- Subtle ground line, no city silhouette -->
  <path d="M 0 540 L 1200 540 L 1200 560 L 0 560 Z" fill="#0F0503" opacity="0.6"/>
</svg>
