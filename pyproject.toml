[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-complaints-classifier"
version = "0.5.0"
description = "8-class Arabic restaurant complaints classifier — 4-model BERT ensemble (CAMeLBERT, MARBERT, AraBERT)"
authors = [{name = "Feras Madkhali"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
keywords = ["arabic", "nlp", "classification", "bert", "complaints", "saudi"]
dependencies = [
    "torch>=2.6",
    "transformers>=5.7",
    "datasets>=4.0",
    "accelerate>=1.13",
    "sentencepiece>=0.2",
    "sacremoses>=0.1",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "gradio>=4.0",
    "pydantic>=2.0",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
api = [
    "prometheus-fastapi-instrumentator>=7.0",
    "slowapi>=0.1.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
analysis = [
    "seaborn>=0.13",
    "matplotlib>=3.8",
]
scraping = [
    "google-play-scraper>=1.2",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/FerasMad/NLP-complaints-system"
Repository = "https://github.com/FerasMad/NLP-complaints-system"

[project.scripts]
complaints-predict = "app.cli:main"

[tool.setuptools]
packages = ["app", "src"]
include-package-data = false

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", "models/", "data/", "notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line too long — handled by formatter
    "RUF001", # ambiguous unicode in Arabic strings (intentional)
    "RUF002", # ambiguous unicode in Arabic docstrings
    "RUF003", # ambiguous unicode in Arabic comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow asserts everywhere

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["app", "src"]
exclude = ["src/_archive/"]

[[tool.mypy.overrides]]
module = ["transformers.*", "datasets.*", "sklearn.*", "google_play_scraper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "gpu: requires CUDA-enabled GPU",
    "slow: takes more than 30 seconds",
    "integration: end-to-end test (loads model, hits API, etc.)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
